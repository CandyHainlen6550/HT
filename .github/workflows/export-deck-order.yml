name: Export Sơ cấp sources for Anki rebuild

on:
  push:
    paths:
      - '.github/workflows/export-deck-order.yml'

jobs:
  export-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact repo deck sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = {}
          for deck in ('sc1','sc2'):
              rows = json.loads(Path(f'public/data/{deck}.json').read_text(encoding='utf-8'))
              out[deck] = [r['kanji'] for r in rows]
              print(deck, len(rows), ''.join(out[deck][:20]))
          Path('deck_order.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deck-sources
          path: |
            public/data/decks.json
            public/data/sc1.json
            public/data/sc2.json
            deck_order.json
          if-no-files-found: error
          retention-days: 1
